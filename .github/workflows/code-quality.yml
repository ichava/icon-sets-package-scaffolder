name: Code Quality

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Laravel Pint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Authenticate Composer for private GitHub deps
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        # This package resolves laranail/{package-tools,console,enumerator}
        # through VCS repositories rather than Packagist, and Composer's git
        # clone has no auth on a fresh runner. Provision a PAT with `repo:read`
        # scope as the GH_PACKAGES_PAT secret. The step short-circuits cleanly
        # when the secret is absent, so public forks are not blocked.
        if: env.GH_PACKAGES_PAT != ''
        run: |
          composer config --global --auth github-oauth.github.com "$GH_PACKAGES_PAT"

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run Laravel Pint
        run: composer pint

  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: PHPStan

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Authenticate Composer for private GitHub deps
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        # This package resolves laranail/{package-tools,console,enumerator}
        # through VCS repositories rather than Packagist, and Composer's git
        # clone has no auth on a fresh runner. Provision a PAT with `repo:read`
        # scope as the GH_PACKAGES_PAT secret. The step short-circuits cleanly
        # when the secret is absent, so public forks are not blocked.
        if: env.GH_PACKAGES_PAT != ''
        run: |
          composer config --global --auth github-oauth.github.com "$GH_PACKAGES_PAT"

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run PHPStan
        run: composer analyse

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Security Audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Authenticate Composer for private GitHub deps
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        # This package resolves laranail/{package-tools,console,enumerator}
        # through VCS repositories rather than Packagist, and Composer's git
        # clone has no auth on a fresh runner. Provision a PAT with `repo:read`
        # scope as the GH_PACKAGES_PAT secret. The step short-circuits cleanly
        # when the secret is absent, so public forks are not blocked.
        if: env.GH_PACKAGES_PAT != ''
        run: |
          composer config --global --auth github-oauth.github.com "$GH_PACKAGES_PAT"

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Security Audit
        run: composer audit

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Nothing else reads these files until a tag is pushed. `release.yml` triggers
    # on `push: tags`, so until now a broken workflow was first observed as a
    # release that refused to start -- after the decision to release had been made.
    #
    # A YAML parse is not a substitute. `yaml.safe_load` accepts a duplicate key
    # and silently keeps the last one, which is how a double-applied patch shipped
    # a step carrying `continue-on-error:` twice and still validated clean.
    # actionlint rejects what Actions rejects.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  scaffolded-workflows:
    name: Scaffolded workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The `actionlint` job above reads `.github/workflows/`, which is this
    # package's own CI -- not the CI it generates. The four workflow stubs are
    # invisible to it twice over: they live under `stubs/`, and a `.stub`
    # extension keeps them out of every YAML tool anyway. They could not be
    # linted in place even if they were found, because `{{kebabName}}` starts a
    # YAML flow mapping, so a stub is not a valid document standalone.
    #
    # So render one and lint that. A broken scaffolded workflow otherwise
    # surfaces in somebody else's repository, at their tag time.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Authenticate Composer for private GitHub deps
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        # This package resolves laranail/{package-tools,console,enumerator}
        # through VCS repositories rather than Packagist, and Composer's git
        # clone has no auth on a fresh runner. Provision a PAT with `repo:read`
        # scope as the GH_PACKAGES_PAT secret. The step short-circuits cleanly
        # when the secret is absent, so public forks are not blocked.
        if: env.GH_PACKAGES_PAT != ''
        run: |
          composer config --global --auth github-oauth.github.com "$GH_PACKAGES_PAT"

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Scaffold a package into the workspace
        id: render
        # Inside the workspace, not RUNNER_TEMP: `raven-actions/actionlint`
        # applies its `working-directory` input to the npm install step only,
        # and resolves `files:` through `@actions/glob` against
        # GITHUB_WORKSPACE. A path outside it globs to nothing.
        run: |
          php scripts/scaffold-sample.php "$GITHUB_WORKSPACE/.scaffolded"
          expected=$(find stubs/.github/workflows -name '*.yml.stub' | wc -l | tr -d ' ')
          rendered=$(find .scaffolded/.github/workflows -name '*.yml' | wc -l | tr -d ' ')
          if [ "$expected" -eq 0 ] || [ "$rendered" -ne "$expected" ]; then
            echo "::error::rendered $rendered workflow files, expected $expected"
            exit 1
          fi
          echo "expected=$expected" >> "$GITHUB_OUTPUT"

      - name: actionlint
        id: scaffolded
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          files: .scaffolded/.github/workflows/*.yml

      - name: Assert the lint read the scaffolded files
        # With `files:` globbing to nothing, actionlint falls back to linting
        # `./.github/workflows` -- this repository's own, already green from the
        # job above -- and this job passes having checked nothing. The count is
        # what distinguishes the two.
        # Both values arrive through `env:` in upper case deliberately:
        # actionlint runs shellcheck over every `run:` block, and SC2154 fires
        # on a lower-case name the script never assigns.
        env:
          LINTED: ${{ steps.scaffolded.outputs.total-files }}
          EXPECTED: ${{ steps.render.outputs.expected }}
        run: |
          if [ "$LINTED" != "$EXPECTED" ]; then
            echo "::error::actionlint linted $LINTED files, expected $EXPECTED -- it did not read the scaffolded tree"
            exit 1
          fi
          echo "actionlint linted $LINTED scaffolded workflow files"

  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Changelog order

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # A misordered CHANGELOG still releases correctly, because release.yml
      # finds a section by heading rather than by position -- so nothing else
      # in this ecosystem catches it. Two packs had it: browser carried
      # [Unreleased] below [0.2.7], and icon-sets-emoji had [0.2.6] filed
      # between [0.1.1] and [0.1.0]. Closing [Unreleased] in place would have
      # filed the new version underneath an older one.
      - name: Check CHANGELOG section order
        run: |
          python3 - CHANGELOG.md <<'PYEOF'
          import re, sys

          path = sys.argv[1]
          try:
              text = open(path, encoding='utf-8').read()
          except FileNotFoundError:
              print(f'::error::{path} not found'); sys.exit(1)

          heads = re.findall(r'^## \[([^\]]+)\]', text, re.M)
          if not heads:
              print(f'::error::{path} has no "## [version]" headings'); sys.exit(1)

          def order_key(v):
              nums = [int(n) for n in re.findall(r'\d+', v)[:3]]
              return tuple(nums + [0] * (3 - len(nums)))

          problems = []
          if 'Unreleased' in heads and heads[0] != 'Unreleased':
              problems.append(
                  f'[Unreleased] is section {heads.index("Unreleased") + 1}, not the first. '
                  'Closing it in place would file the new version below an older one.')

          versions = [h for h in heads if h != 'Unreleased']
          for older, newer in zip(versions, versions[1:]):
              if order_key(older) < order_key(newer):
                  problems.append(f'[{older}] is listed above [{newer}], but is the lower version.')

          if problems:
              print(f'::error::{path} sections are out of order:')
              for p in problems:
                  print(f'::error::  {p}')
              sys.exit(1)

          print(f'{path}: {len(heads)} sections, correctly ordered')
          PYEOF
